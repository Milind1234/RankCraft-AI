services:
  - type: web
    name: rankcraft-ai
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 7860
      - key: OMP_NUM_THREADS
        value: 1
      - key: MKL_NUM_THREADS
        value: 1
      - key: TOKENIZERS_PARALLELISM
        value: false
      - key: HF_HUB_OFFLINE
        value: 1
